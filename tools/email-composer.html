<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian — Email Composer</title>
<style>
  :root {
    --bg: #0a1628;
    --surface: #0d1e35;
    --border: #1a3050;
    --accent: #00d4aa;
    --accent-glow: rgba(0, 212, 170, 0.15);
    --text: #e8edf5;
    --text-muted: #8899b4;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 24px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.6;
  }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
  .contact-list { max-height: 240px; overflow-y: auto; }
  .contact-list::-webkit-scrollbar { width: 6px; }
  .contact-list::-webkit-scrollbar-track { background: var(--bg); border-radius: 3px; }
  .contact-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.9rem;
  }
  .contact-item:last-child { border-bottom: none; }
  .contact-item input[type="checkbox"] {
    accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0;
  }
  .contact-email { color: var(--text); min-width: 220px; }
  .contact-source { color: var(--text-muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-domain { margin-left: auto; font-size: 0.75rem; color: var(--accent); background: var(--accent-glow); padding: 2px 10px; border-radius: 100px; }
  .no-contacts { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px 16px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 160px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 12px 28px; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: #00b894; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }
  .status {
    padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; display: none;
  }
  .status.show { display: block; }
  .status.info { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
  .status.success { background: rgba(0,212,170,0.12); color: var(--accent); border: 1px solid rgba(0,212,170,0.2); }
  .status.error { background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
  .count-badge {
    font-size: 0.8rem; color: var(--text-muted); background: var(--bg);
    padding: 2px 10px; border-radius: 100px; margin-left: 8px;
  }
  .select-all { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--accent); background: none; border: none; padding: 0; }
  .select-all:hover { text-decoration: underline; }
  .progress-bar {
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 12px; display: none;
  }
  .progress-bar.show { display: block; }
  .progress-fill {
    height: 100%; width: 0%; background: var(--accent); transition: width 0.3s;
  }
  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    .contact-email { min-width: 140px; }
    .contact-source { display: none; }
    .toolbar { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<h1><span>✉️</span> Email Composer</h1>
<p class="subtitle">Select recipients, compose your message, and send via Gmail SMTP.</p>

<div class="card">
  <h2>Recipients <span class="count-badge" id="total-count">0</span></h2>
  <button class="select-all" id="select-all-btn">☐ Select all</button>
  <div class="contact-list" id="contact-list">
    <div class="no-contacts">No contacts loaded. Run <code>python3 find-people.py</code> first, then start the server.</div>
  </div>
</div>

<div class="card">
  <div class="form-group">
    <label for="subject">Subject</label>
    <input type="text" id="subject" placeholder="Enter email subject..." value="Introduction — Guardian Data Protection Services">
  </div>
  <div class="form-group">
    <label for="body">Message</label>
    <textarea id="body" placeholder="Write your email...">Hi {name},

I came across your profile and wanted to reach out regarding data protection and cybersecurity services.

At Guardian, we specialize in helping organizations prevent data leaks, respond to security incidents, and maintain compliance with regulations like GDPR and HIPAA.

I'd love to connect and explore how we might be able to help your organization strengthen its security posture.

Would you be open to a brief call sometime this week?

Best regards,
Ian
Guardian Security Team</textarea>
  </div>
</div>

<div class="toolbar" style="margin-bottom: 16px;">
  <button class="btn btn-primary" id="send-btn">Send to Selected (0) →</button>
  <button class="btn btn-danger" id="clear-btn">Clear Selection</button>
  <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--text-muted);margin-left:auto;">
    <input type="checkbox" id="dry-run" checked> Dry run (don't actually send)
  </label>
</div>

<div class="status" id="status"></div>
<div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<script>
const API = "";

let contacts = [];
let selected = new Set();

async function loadContacts() {
  try {
    const res = await fetch("/api/contacts");
    const data = await res.json();
    contacts = data.contacts || [];
    renderContacts();
  } catch (e) {
    showStatus("Failed to load contacts. Make sure the server is running.", "error");
  }
}

function renderContacts() {
  const list = document.getElementById("contact-list");
  const total = document.getElementById("total-count");
  
  if (!contacts.length) {
    list.innerHTML = `<div class="no-contacts">No contacts found. Run <code>python3 find-people.py emails &lt;domain&gt; --export</code> first.</div>`;
    total.textContent = "0";
    return;
  }
  
  total.textContent = contacts.length;
  
  let html = "";
  for (const c of contacts) {
    const domain = c.email.split("@")[1] || "";
    const checked = selected.has(c.email) ? "checked" : "";
    html += `
      <div class="contact-item">
        <input type="checkbox" value="${c.email}" ${checked} class="contact-cb">
        <span class="contact-email">${c.email}</span>
        <span class="contact-source">${(c.context || c.source || "").slice(0, 50)}</span>
        <span class="contact-domain">${domain}</span>
      </div>
    `;
  }
  list.innerHTML = html;
  
  document.querySelectorAll(".contact-cb").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(cb.value);
      else selected.delete(cb.value);
      updateUI();
    });
  });
}

function updateUI() {
  const btn = document.getElementById("send-btn");
  const count = selected.size;
  btn.textContent = count ? `Send to Selected (${count}) →` : "Send to Selected (0) →";
  btn.disabled = count === 0;
  document.getElementById("select-all-btn").textContent =
    selected.size === contacts.length ? "☑ Deselect all" : "☐ Select all";
}

document.getElementById("select-all-btn").addEventListener("click", () => {
  if (selected.size === contacts.length) {
    selected.clear();
    document.querySelectorAll(".contact-cb").forEach(cb => cb.checked = false);
  } else {
    contacts.forEach(c => selected.add(c.email));
    document.querySelectorAll(".contact-cb").forEach(cb => cb.checked = true);
  }
  updateUI();
});

document.getElementById("clear-btn").addEventListener("click", () => {
  selected.clear();
  document.querySelectorAll(".contact-cb").forEach(cb => cb.checked = false);
  updateUI();
});

document.getElementById("send-btn").addEventListener("click", sendEmails);

function showStatus(msg, type = "info") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status show " + type;
}

function setProgress(pct) {
  const bar = document.getElementById("progress-bar");
  const fill = document.getElementById("progress-fill");
  bar.classList.add("show");
  fill.style.width = pct + "%";
}

async function sendEmails() {
  const recipients = Array.from(selected);
  if (!recipients.length) return;

  const subject = document.getElementById("subject").value.trim();
  const body = document.getElementById("body").value.trim();
  const dryRun = document.getElementById("dry-run").checked;

  if (!subject || !body) {
    showStatus("Subject and message body are required.", "error");
    return;
  }

  const btn = document.getElementById("send-btn");
  btn.disabled = true;
  btn.textContent = dryRun ? "Previewing..." : "Sending...";
  showStatus(dryRun ? `Dry run: checking ${recipients.length} recipient(s)...` : `Sending to ${recipients.length} recipient(s)...`, "info");
  setProgress(10);

  let sent = 0, failed = 0;

  for (let i = 0; i < recipients.length; i++) {
    const email = recipients[i];
    const local = email.split("@")[0];
    const name = local.split(/[._-]/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
    
    const personalizedBody = body.replace(/\{name\}/g, name);

    try {
      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          to: email,
          subject: subject,
          body: personalizedBody,
          dry_run: dryRun,
        }),
      });
      const data = await res.json();
      if (data.ok) sent++;
      else failed++;
    } catch (e) {
      failed++;
    }

    setProgress(10 + ((i + 1) / recipients.length) * 80);
    showStatus(
      dryRun
        ? `Previewing: ${sent + failed}/${recipients.length}`
        : `Sent: ${sent} | Failed: ${failed} | ${sent + failed}/${recipients.length}`,
      failed > 0 ? "error" : "info"
    );
  }

  setProgress(100);
  if (dryRun) {
    showStatus(`✓ Dry run complete. ${sent} would send, ${failed} would fail.`);
  } else {
    showStatus(`✓ Done! ${sent} sent successfully, ${failed} failed.`, failed === 0 ? "success" : "error");
  }

  btn.disabled = false;
  btn.textContent = "Send to Selected (" + selected.size + ") →";
}

loadContacts();
</script>
</body>
</html>
